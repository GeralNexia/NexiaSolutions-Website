<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - Nexia Solutions</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #09090b;
        color: #f4f4f5;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .container {
        max-width: 400px;
      }
      img {
        height: 40px;
        width: auto;
        border-radius: 10px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 1.8rem;
        margin-bottom: 10px;
      }
      p {
        color: #a1a1aa;
        font-size: 0.9rem;
        line-height: 1.5;
        margin-bottom: 25px;
      }
      .btn {
        display: inline-block;
        background-color: #3b82f6;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9rem;
        transition: background-color 0.2s;
      }
      .btn:hover {
        background-color: #2563eb;
      }
    </style>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirection script
      var pathSegmentsToKeep = 1;
      var l = window.location;
      
      // Se preferires redirecionar de imediato sem mostrar o erro, podes manter o script ativo.
      // Se quiseres mostrar o design primeiro, podes ajustar a lógica ou deixar o HTML estático bonito.
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div class="container">
      <img src="./nexia-logo.png" alt="Nexia Solutions">
      <h1>Página não encontrada</h1>
      <p>Lamentamos, mas a página que estás à procura não existe ou foi movida.</p>
      <a href="/NexiaSolutions-Website/" class="btn">Voltar ao Início</a>
    </div>
  </body>
</html>
